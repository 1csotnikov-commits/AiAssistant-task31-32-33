[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assistant"
version = "0.1.0"
description = "AiAssistant: RAG/MCP-ассистент разработчика, ревью PR и поддержка пользователей"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AiAssistant contributors" }]
keywords = ["rag", "mcp", "deepseek", "code-review", "fastapi", "sqlite-fts5"]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "mcp>=2.0,<3",
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
aiassist = "ai_assistant.cli:app"

[project.urls]
Repository = "https://github.com/1csotnikov-commits/AiAssistant-task31-32-33"

[tool.setuptools]
packages = ["ai_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP045"]

[tool.ruff.lint.per-file-ignores]
"ai_assistant/cli.py" = ["B008"]
"ai_assistant/task33_support.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
files = ["ai_assistant"]
